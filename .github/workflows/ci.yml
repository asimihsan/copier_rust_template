name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  full:
    name: Full Configuration
    uses: ./.github/workflows/ci-steps.yml
    with:
      wasm: true
      python: true
      go: true
      leptos: true
      uniffi: true
      cache_suffix: "full"

  matrix:
    name: Matrix Configurations
    needs: full
    strategy:
      matrix:
        config:
          - { wasm: true,  python: false, go: false, leptos: false, uniffi: false, cache_suffix: "wasm-only" }
          - { wasm: false, python: true,  go: false, leptos: false, uniffi: false, cache_suffix: "python-only" }
          - { wasm: false, python: false, go: false, leptos: false, uniffi: false, cache_suffix: "default" }
          - { wasm: false, python: false, go: true,  leptos: false, uniffi: false, cache_suffix: "go-only" }
          - { wasm: false, python: false, go: false, leptos: true,  uniffi: false, cache_suffix: "leptos-only" }
          - { wasm: false, python: false, go: false, leptos: false, uniffi: true,  cache_suffix: "uniffi-only" }
    uses: ./.github/workflows/ci-steps.yml
    with:
      wasm: ${{ matrix.config.wasm }}
      python: ${{ matrix.config.python }}
      go: ${{ matrix.config.go }}
      leptos: ${{ matrix.config.leptos }}
      uniffi: ${{ matrix.config.uniffi }}
      cache_suffix: ${{ matrix.config.cache_suffix }}
